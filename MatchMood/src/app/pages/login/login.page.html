<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Connexion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Connexion</ion-title>
    </ion-toolbar>
  </ion-header>

  <form [formGroup]="loginForm" (ngSubmit)="login()">

    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input
        type="email"
        formControlName="email"
        inputmode="email"
        required
        autocomplete="email"
        autocorrect="off"
      ></ion-input>
      <ion-note slot="error" *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
        L'email est requis.
      </ion-note>
      <ion-note slot="error" *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched">
        Email invalide.
      </ion-note>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Mot de passe</ion-label>
      <ion-input
        type="password"
        formControlName="password"
        required
      ></ion-input>
      <ion-note slot="error" *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
        Le mot de passe est requis.
      </ion-note>
    </ion-item>

    <ion-button
      type="submit"
      expand="block"
      class="ion-margin-top"
      [disabled]="!loginForm.valid || isLoading">
      <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
      <span *ngIf="!isLoading">Se connecter</span>
    </ion-button>

  </form>

  <ion-button
      expand="block"
      class="ion-margin-top"
      (click)="googleLogin()"
      color="danger"
      [disabled]="isLoading">
      <ion-icon name="logo-google" slot="start"></ion-icon>
      <ion-spinner *ngIf="isLoadingGoogle" name="crescent"></ion-spinner>
      <span *ngIf="!isLoadingGoogle">Se connecter avec Google</span>
  </ion-button>

  <ion-button expand="block" fill="clear" class="ion-margin-top" (click)="goToSignup()">
    Pas encore de compte ? S'inscrire
  </ion-button>

</ion-content>
