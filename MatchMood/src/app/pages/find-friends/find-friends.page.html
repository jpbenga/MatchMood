<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
       </ion-buttons>
    <ion-title>Trouver des amis</ion-title>
  </ion-toolbar>
  <ion-toolbar>
     <ion-searchbar
        placeholder="Rechercher par nom ou email"
        debounce="500"
        (ionInput)="handleSearchInput($event)"
        #searchInput>
     </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
      <ion-item *ngIf="isLoading">
          <ion-spinner name="crescent" slot="start"></ion-spinner>
          <ion-label>Recherche en cours...</ion-label>
      </ion-item>

      <div *ngIf="!isLoading && searchResults.length > 0">
          <ion-item *ngFor="let user of searchResults">
              <ion-avatar slot="start">
                  <ion-img [src]="user.photoURL || 'assets/icon/avatar-placeholder.png'"></ion-img>
                   </ion-avatar>
              <ion-label>
                  <h2>{{ user.displayName || 'Utilisateur' }}</h2>
                  <p>{{ user.email }}</p>
              </ion-label>
              <ion-button fill="outline" slot="end" (click)="sendRequest(user.uid)">
                  <ion-icon name="person-add-outline" slot="icon-only"></ion-icon>
              </ion-button>
          </ion-item>
      </div>

      <ion-item *ngIf="!isLoading && searchResults.length === 0 && searchPerformed">
           <ion-label class="ion-text-center">Aucun utilisateur trouvé.</ion-label>
      </ion-item>

      <ion-item *ngIf="!isLoading && !searchPerformed">
          <ion-label class="ion-text-center">Entrez un nom ou un email pour rechercher.</ion-label>
      </ion-item>

  </ion-list>

</ion-content>
