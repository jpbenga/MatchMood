<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Inscription</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inscription</ion-title>
    </ion-toolbar>
  </ion-header>

  <form [formGroup]="signupForm" (ngSubmit)="signup()">

    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input
        type="email"
        formControlName="email"
        inputmode="email"
        required
        autocomplete="email"
        autocorrect="off"
      ></ion-input>
      <ion-note slot="error" *ngIf="signupForm.get('email')?.hasError('required') && signupForm.get('email')?.touched">
        L'email est requis.
      </ion-note>
      <ion-note slot="error" *ngIf="signupForm.get('email')?.hasError('email') && signupForm.get('email')?.touched">
        Email invalide.
      </ion-note>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Mot de passe</ion-label>
      <ion-input
        type="password"
        formControlName="password"
        required
      ></ion-input>
      <ion-note slot="error" *ngIf="signupForm.get('password')?.hasError('required') && signupForm.get('password')?.touched">
        Le mot de passe est requis.
      </ion-note>
      <ion-note slot="error" *ngIf="signupForm.get('password')?.hasError('minlength') && signupForm.get('password')?.touched">
        Le mot de passe doit faire au moins 6 caractères.
      </ion-note>
    </ion-item>

     <ion-item>
      <ion-label position="floating">Confirmer le mot de passe</ion-label>
      <ion-input
        type="password"
        formControlName="confirmPassword"
        required
      ></ion-input>
      <ion-note slot="error" *ngIf="signupForm.get('confirmPassword')?.hasError('required') && signupForm.get('confirmPassword')?.touched">
        La confirmation est requise.
      </ion-note>
       <ion-note slot="error" *ngIf="signupForm.hasError('passwordsMismatch') && signupForm.get('confirmPassword')?.touched">
        Les mots de passe ne correspondent pas.
      </ion-note>
    </ion-item>

    <ion-button
      type="submit"
      expand="block"
      class="ion-margin-top"
      [disabled]="!signupForm.valid || isLoading">
      <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
      <span *ngIf="!isLoading">S'inscrire</span>
    </ion-button>

  </form>

</ion-content>
